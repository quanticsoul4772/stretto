name: M0 size probe (LTO split + Zig module cost)

# THROWAWAY BRANCH -- never merged, deleted after the run.
#
# Two prior attempts at this measurement produced wrong conclusions.
# The first compiled ALL seventeen .c files with `zig cc` and reported
# "Zig is 12% over budget" -- that measured replacing gcc with clang
# for the existing C codebase, and contained zero lines of Zig. The
# second measured two real Zig modules but attributed the cost to Zig
# codegen, when the mechanism is that a ported module leaves gcc's LTO
# unit (CFLAGS carries -Os -flto -fuse-linker-plugin; a zig build-obj
# output is a plain ELF object the LTO plugin does not claim).
#
# tools/m0-size-probe.sh separates those terms. The load-bearing
# variant is #1: density.c, still C, still gcc, compiled -fno-lto. It
# sits at exactly the LTO boundary a Zig object would, with identical
# source semantics, so its cost IS the LTO exit cost. Everything a Zig
# object costs beyond that is codegen.
#
# Everything is built in one job at one commit with STRETTO_VERSION
# pinned on the command line -- version.h embeds `git describe
# --tags --always --dirty` and is compiled in, and swapping a .c for a
# .zig dirties the tree by construction. That is worth up to ~16 B
# against ~670 B of headroom.
#
# Runner is ubuntu-24.04 to match ci.yml and release.yml. The 30048 B
# reference figure in Principle I came from this image, and the gate
# script records that CI's gcc 13 emits more text than local compilers
# -- which is why the VPS cannot settle a question this tight.

on:
  push:
    branches: [089-m0-size-probe]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  size-probe:
    name: LTO split and Zig module cost
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe needs tags for version.h

      - name: Install build deps
        # Same list as ci.yml's build-test-coverage job, minus the
        # MinGW cross and numpy: this probe builds Linux only.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make pkg-config \
                                  libpulse-dev libasound2-dev upx-ucl

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          # Pinned, not latest. ci.yml pins the runner image because a
          # glibc bump can flip a generated table entry and change
          # every render hash; a 0.x compiler with no codegen stability
          # guarantee deserves at least the same treatment.
          version: 0.16.0

      - name: Probe
        run: bash tools/m0-size-probe.sh

      - uses: actions/upload-artifact@v4
        with:
          # Distinct from ci.yml's `binary-sizes`: upload-artifact@v4
          # fails on a duplicate name within one run.
          name: m0-size-probe
          path: |
            /tmp/m0-results.txt
